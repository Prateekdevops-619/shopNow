server {
    listen 80;
    server_name _;

    # This points to the folder where your React build files are stored
    root /usr/share/nginx/html;
    index index.html;

    # 1. THE REWRITE FIX: 
    # This matches any request starting with /aryan/ and strips the prefix.
    # Browser request: /aryan/static/js/main.js 
    # Nginx looks for: /static/js/main.js (which exists in your root)
    location /aryan/ {
        rewrite ^/aryan/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    # 2. SPA Fallback:
    # If a user hits the root or any other path, send them to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 3. API Proxy:
    # Forwards frontend API calls to your backend service inside the EKS cluster
    location /aryan/api/ {
        proxy_pass         http://backend-service:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass         http://backend-service:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 4. Health Check:
    # Required for the AWS Load Balancer to mark this pod as 'InService'
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'OK';
    }

    # 5. Mime Types & Security
    include /etc/nginx/mime.types;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
}
