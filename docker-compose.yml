version: '3.8'

services:
  backend:
    build: ./backend        # builds from ./backend/Dockerfile
    container_name: shopnow-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production

  frontend:
    build: ./frontend       # builds from ./frontend/Dockerfile
    container_name: shopnow-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend