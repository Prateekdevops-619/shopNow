apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: shopnow
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    alerting:
      alertmanagers:
        - static_configs:
            - targets: []

    rule_files:
      - /etc/prometheus/rules/*.yml

    scrape_configs:
      - job_name: 'shopnow-backend'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ['shopnow']
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app

      - job_name: 'kubernetes-nodes'
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)

      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"

  alerts.yml: |
    groups:
      - name: shopnow-alerts
        rules:
          - alert: HighCPUUsage
            expr: rate(container_cpu_usage_seconds_total{namespace="shopnow"}[5m]) > 0.8
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "High CPU usage on {{ $labels.pod }}"
              description: "CPU usage > 80% for 2 minutes."

          - alert: PodCrashLooping
            expr: rate(kube_pod_container_status_restarts_total{namespace="shopnow"}[15m]) > 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Pod {{ $labels.pod }} is crash-looping"
              description: "Container restarting repeatedly."

          - alert: BackendDown
            expr: up{job="shopnow-backend"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "ShopNow backend is down"
              description: "Backend service has been unreachable for 1 minute."

          - alert: HighMemoryUsage
            expr: container_memory_usage_bytes{namespace="shopnow"} / container_spec_memory_limit_bytes{namespace="shopnow"} > 0.85
            for: 3m
            labels:
              severity: warning
            annotations:
              summary: "High memory usage on {{ $labels.pod }}"
              description: "Memory usage exceeds 85% of limit."
